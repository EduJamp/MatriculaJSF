<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Cursos disponibles</title>
    <h:outputStylesheet name="estilos.css" library="css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"/>
</h:head>
<h:body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card shadow p-4">

                    <h1 class="h3 mb-4 fw-normal text-primary text-center">Cursos disponibles</h1>

                    <!-- Diapositiva 9: value = coleccion, var = fila actual -->
                    <div class="table-responsive">
                        <h:dataTable value="#{cursoBean.cursos}" var="c"
                                     styleClass="table table-striped table-hover align-middle" headerClass="table-dark">

                            <h:column>
                                <f:facet name="header">Curso</f:facet>
                                <h:outputText value="#{c.nombre}"/>
                            </h:column>

                            <h:column>
                                <f:facet name="header">Docente</f:facet>
                                <h:outputText value="#{c.docente}"/>
                            </h:column>

                            <h:column>
                                <f:facet name="header">Vacantes</f:facet>
                                <h:outputText value="#{c.vacantes}"/>
                            </h:column>

                            <h:column>
                                <f:facet name="header">Creditos</f:facet>
                                <h:outputText value="#{c.creditos}"/>
                            </h:column>

                            <!-- Diapositiva 10: enlace por fila + parametro id en la URL -->
                            <h:column>
                                <f:facet name="header">Detalle</f:facet>
                                <h:outputLink value="detalle.xhtml" styleClass="btn btn-sm btn-outline-primary">
                                    <f:param name="id" value="#{c.id}"/>
                                    <h:outputText value="Ver"/>
                                </h:outputLink>
                            </h:column>
                        </h:dataTable>
                    </div>

                    <div class="text-center mt-4">
                        <h:outputLink value="index.xhtml" styleClass="btn btn-secondary">Volver al inicio</h:outputLink>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</h:body>
</html>
