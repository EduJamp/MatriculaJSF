<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">
<h:head>
    <title>Confirmacion</title>
    <h:outputStylesheet name="estilos.css" library="css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"/>
</h:head>
<h:body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow p-4 text-center">

                    <div class="mb-3">
                        <!-- Icono de éxito con Bootstrap -->
                        <span class="badge bg-success p-3 rounded-circle fs-4 mb-2">✓</span>
                    </div>

                    <h1 class="h3 mb-4 fw-normal text-success">Matricula registrada</h1>

                    <div class="alert alert-secondary py-3 text-start mb-4" role="alert">
                        <p class="mb-2">Codigo: <strong><h:outputText value="#{matriculaBean.codigo}"/></strong></p>
                        <p class="mb-0">Estudiante: <strong><h:outputText value="#{matriculaBean.nombre}"/></strong></p>
                    </div>

                    <div class="d-grid gap-2">
                        <h:outputLink value="listado.xhtml" styleClass="btn btn-primary btn-lg">Ver cursos</h:outputLink>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</h:body>
</html>
