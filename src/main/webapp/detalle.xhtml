<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Detalle del curso</title>
    <h:outputStylesheet name="estilos.css" library="css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"/>
</h:head>
<h:body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card shadow p-4">

                    <h1 class="h3 mb-3 fw-normal text-primary text-center">Detalle del curso</h1>

                    <div class="alert alert-secondary py-2 text-center" role="alert">
                        Id recibido en la URL: <strong><h:outputText value="#{param.id}"/></strong>
                    </div>

                    <!-- Si el id existe, mostramos los datos -->
                    <h:panelGroup rendered="#{not empty cursoBean.buscar(param.id)}">
                        <ul class="list-group list-group-flush mb-4">
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                <strong>Curso:</strong>
                                <span class="text-secondary"><h:outputText value="#{cursoBean.buscar(param.id).nombre}"/></span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                <strong>Docente:</strong>
                                <span class="text-secondary"><h:outputText value="#{cursoBean.buscar(param.id).docente}"/></span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                <strong>Creditos:</strong>
                                <span class="badge bg-secondary rounded-pill"><h:outputText value="#{cursoBean.buscar(param.id).creditos}"/></span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                <strong>Vacantes:</strong>
                                <span class="badge bg-info text-dark rounded-pill"><h:outputText value="#{cursoBean.buscar(param.id).vacantes}"/></span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                <strong>Esta Disponible:</strong>
                                <span class="fw-bold"><h:outputText value="#{cursoBean.cursoDisponible(param.id)}"/></span>
                            </li>
                        </ul>
                    </h:panelGroup>

                    <!-- Pregunta guia de la diapositiva 10: id inexistente -->
                    <h:panelGroup rendered="#{empty cursoBean.buscar(param.id)}">
                        <div class="alert alert-danger text-center" role="alert">
                            <p class="error mb-0">El curso solicitado no existe.</p>
                        </div>
                    </h:panelGroup>

                    <div class="text-center mt-3">
                        <h:outputLink value="listado.xhtml" styleClass="btn btn-outline-secondary">Volver al listado</h:outputLink>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</h:body>
</html>
