<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Matricula - Inicio</title>
    <h:outputStylesheet name="estilos.css" library="css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"/>
</h:head>
<h:body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <div class="card shadow p-4">
                    <h1 class="h3 mb-3 fw-normal text-primary">Sistema de matricula</h1>
                    <p class="text-muted mb-4">Desarrollo Web Integrado - Semana 11</p>

                    <h:form>
                        <div class="d-grid gap-2">
                            <!-- Navegacion IMPLICITA: el outcome "listado" abre listado.xhtml -->
                            <h:commandButton value="Ver cursos" action="listado?faces-redirect=true" styleClass="btn btn-outline-primary btn-lg"/>
                            <!-- Navegacion EXPLICITA: la logica esta en MatriculaBean + faces-config.xml -->
                            <h:commandButton value="Matricularme" action="matricula" styleClass="btn btn-primary btn-lg"/>
                        </div>
                    </h:form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</h:body>
</html>
