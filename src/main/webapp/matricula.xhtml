<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Formulario de matricula</title>
    <h:outputStylesheet name="estilos.css" library="css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"/>
</h:head>
<h:body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow p-4">

                    <h1 class="h3 mb-4 fw-normal text-primary text-center">Formulario de matricula</h1>

                    <!-- Mensajes de validación / error estilizados -->
                    <h:messages globalOnly="false"
                                styleClass="list-unstyled"
                                errorClass="alert alert-danger p-2 mb-3 text-center"
                                infoClass="alert alert-success p-2 mb-3 text-center" />

                    <h:form>
                        <div class="mb-3">
                            <h:outputLabel for="codigo" value="Codigo:" styleClass="form-label fw-bold"/>
                            <h:inputText id="codigo" value="#{matriculaBean.codigo}" styleClass="form-control">
                                <f:validateLength minimum="5" maximum="10"/>
                            </h:inputText>
                            <div class="form-text">Mínimo 5 y máximo 10 caracteres.</div>
                        </div>

                        <div class="mb-3">
                            <h:outputLabel for="nombre" value="Nombre:" styleClass="form-label fw-bold"/>
                            <h:inputText id="nombre" value="#{matriculaBean.nombre}" styleClass="form-control"/>
                        </div>

                        <!-- action devuelve un outcome: "exito" o "error" (ver faces-config.xml) -->
                        <div class="d-grid gap-2 mt-4">
                            <h:commandButton value="Enviar" action="#{matriculaBean.guardar}" styleClass="btn btn-primary btn-lg"/>
                        </div>
                    </h:form>

                    <div class="text-center mt-4">
                        <h:outputLink value="index.xhtml" styleClass="btn btn-outline-secondary">Volver al inicio</h:outputLink>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</h:body>
</html>
